{{ $img := .img }}
{{ $caption := .caption }}
{{ $alt := $caption | default (path.BaseName $img.Name) }}
<figure class="polaroid">
  <div class="polaroid-img">
    <img src="{{ $img.RelPermalink }}" alt="{{ $alt }}" loading="lazy" decoding="async">
  </div>
  <figcaption class="polaroid-caption">
    <span class="polaroid-index">#{{ .index }}</span>
    {{ with $caption }}<span>{{ . }}</span>{{ end }}
  </figcaption>
</figure>
