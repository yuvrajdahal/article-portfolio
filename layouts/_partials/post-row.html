{{/* Posts published elsewhere carry `external:` and link straight out. */}}
{{ $external := .Params.external }}
<a class="row row-link flex flex-col gap-2 md:flex-row md:gap-6" href="{{ $external | default .RelPermalink }}"
   {{- with $external }} target="_blank" rel="noopener"{{ end }}>
  <div class="meta flex gap-3 md:w-36 md:flex-col md:gap-1">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    <span>{{ with .Params.externalSource }}{{ . }} ↗{{ else }}{{ .ReadingTime }} min read{{ end }}</span>
  </div>
  <div class="min-w-0 flex-1">
    <h3 class="row-title">{{ .Title }}</h3>
    <p class="row-desc">{{ .Description | default .Summary | plainify }}</p>
  </div>
</a>
