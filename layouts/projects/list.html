{{ define "main" }}
<div class="container-page">
  <header class="page-head">
    <p class="kicker fade-up">Projects</p>
    <h1 class="page-title fade-up" style="--d:0.06s">{{ .Title }}</h1>
    {{ with .Description }}<p class="lead fade-up" style="--d:0.14s">{{ . }}</p>{{ end }}
  </header>

  {{ with .Content }}<div class="prose prose-narrow">{{ . }}</div>{{ end }}

  <div class="cards mt-12">
    {{ range $i, $p := .Pages }}
      {{ partial "project-card.html" (dict "page" $p "i" $i) }}
    {{ else }}
      <p class="empty">No projects published yet.</p>
    {{ end }}
  </div>
</div>
{{ end }}
