{{ define "main" }}
<div class="container-page">
  <header class="page-head">
    <p class="kicker fade-up">{{ .Params.kicker | default .Title }}</p>
    <h1 class="page-title fade-up" style="--d:0.06s">{{ .Title }}</h1>
    {{ with .Description }}<p class="lead fade-up" style="--d:0.14s">{{ . }}</p>{{ end }}
  </header>

  {{ with .Content }}<div class="prose prose-narrow">{{ . }}</div>{{ end }}

  <div class="rows mt-10" data-reveal>
    {{ range .Pages }}
      {{ partial "post-row.html" . }}
    {{ else }}
      <p class="empty">Nothing here yet.</p>
    {{ end }}
  </div>
</div>
{{ end }}
